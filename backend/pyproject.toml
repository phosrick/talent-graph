[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-graph"
version = "0.1.0"
description = "TalentGraph (思拓) - 高性能 AI 无领导小组讨论人才评估系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TalentGraph Team" }
]
keywords = ["talent-assessment", "graph-theory", "llm", "deepseek", "fastapi"]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "playwright>=1.44.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jieba>=0.42.1",
    "websockets>=12.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
talent = "cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
